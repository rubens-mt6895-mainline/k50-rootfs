# K50 (rubens / MT6895 + MT6368) 的 UCM 定义。
# 目的：让 PipeWire 同时暴露「扬声器」和「耳机」两个端口。
# 这张卡有两个 PCM 播放设备：device 0 = 耳机通路，device 2 = 扬声器通路
# （DL2 → I2S3 → TFA9874 智能功放），不开 UCM 时 PipeWire 只认 device 0，
# 于是 GNOME 里只有「模拟耳机」，外放永远没声。
Syntax 3

SectionDefaults [
	cset "name='Ext_Speaker_Amp Switch' on"
]

SectionUseCase."HiFi" {
	File "/mt6895-mt6368/HiFi.conf"
	Comment "Play music"
}
