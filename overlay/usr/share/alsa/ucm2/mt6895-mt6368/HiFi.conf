# K50 的 HiFi 用例：扬声器（PCM device 2）/ 耳机（PCM device 0）。
Syntax 3

SectionVerb {
	EnableSequence [
		cset "name='Ext_Speaker_Amp Switch' on"
	]
	DisableSequence [
		cset "name='Ext_Speaker_Amp Switch' off"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker".0 {
	Comment "Speaker"

	EnableSequence [
		cset "name='Ext_Speaker_Amp Switch' on"
		cset "name='Right SmartPA Mute' off"
	]

	DisableSequence [
		cset "name='Ext_Speaker_Amp Switch' off"
	]

	Value {
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 2
		PlaybackPriority 200
	}
}

SectionDevice."Headphones".0 {
	Comment "Headphones"

	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackPriority 100
		JackControl "Headphone Plugged In"
	}
}
